<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Frontend Mentor | Expenses chart component</title>

  <link rel="stylesheet" href="src/styles.css">
  <script src="src/script.js" defer type="module"></script>
</head>

<body>
  <header aria-labelledby="my-balance">
    <h1 id="my-balance">My balance <span id="my-balance-value">$921.48</span></h1>
  </header>

  <section aria-labelledby="spending-last-7-days">
    <h2 id="spending-last-7-days">Spending - Last 7 days</h2>
    <ul>
      <li>mon</li>
      <li>tue</li>
      <li>wed</li>
      <li>thu</li>
      <li>fri</li>
      <li>sat</li>
      <li>sun</li>
    </ul>
  </section>

  <section aria-labelledby="total-this-month">
    <h2 id="total-this-month">Total this month <span id="total-this-month-value">$478.33</span>
    </h2>
  </section>

  <section aria-labelledby="percentage-increase-from-last-month">
    <h2 id="percentage-increase-from-last-month"><span id="percentage-increase-from-last-month-value">+2.4%</span> from
      last month</h2>
  </section>
</body>

</html>
