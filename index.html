<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Frontend Mentor | Expenses chart component</title>

  <link rel="stylesheet" href="src/styles.css">

  <!-- fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
    rel="stylesheet">

  <script src="src/script.js" defer type="module"></script>
</head>

<body>
  <p id="load-error" class="error">* Failed to load data. <button id="load-data-btn" type="button">try again</button>
  </p>
  <p id="load-message" class="load-message">Loading...</p>
  <div id="content">
    <header aria-labelledby="my-balance">
      <h1 id="my-balance">My balance <span id="my-balance-value"></span></h1>
      <img src="images/logo.svg" alt="" width="72" height="59">
    </header>

    <div class="spending-card">
      <section aria-labelledby="spending-last-7-days">
        <h2 id="spending-last-7-days">Spending - Last 7 days</h2>
        <ul class="bar-chart">
          <li>
            <p class="day">mon</p>
            <div class="bar mon"></div>
            <div class="spending mon"></div>
          </li>
          <li>
            <p class="day">tue</p>
            <div class="bar tue"></div>
            <div class="spending tue"></div>
          </li>
          <li>
            <p class="day">wed</p>
            <div class="bar wed"></div>
            <div class="spending wed"></div>
          </li>
          <li>
            <p class="day">thu</p>
            <div class="bar thu"></div>
            <div class="spending thu"></div>
          </li>
          <li>
            <p class="day">fri</p>
            <div class="bar fri"></div>
            <div class="spending fri"></div>
          </li>
          <li>
            <p class="day">sat</p>
            <div class="bar sat"></div>
            <div class="spending sat"></div>
          </li>
          <li>
            <p class="day">sun</p>
            <div class="bar sun"></div>
            <div class="spending sun"></div>
          </li>
        </ul>
      </section>

      <div class="divider" aria-hidden="true"></div>

      <div class="spending-total">
        <section aria-labelledby="total-this-month">
          <h2 id="total-this-month">Total this month <span id="total-this-month-value"></span>
          </h2>
        </section>

        <section aria-labelledby="percentage-increase-from-last-month">
          <h2 id="percentage-increase-from-last-month"><span id="percentage-increase-from-last-month-value"></span> from
            last month</h2>
        </section>
      </div>
    </div>
  </div>
</body>

</html>
